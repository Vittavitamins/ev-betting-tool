on:
  schedule:
    # 10:00 UTC ≈ 6:00 AM ET. Note this drifts to 5:00 AM ET during EST
    # (Nov–Mar) since GitHub cron doesn't follow daylight saving. Adjust
    # if that matters to you.
    - cron: '0 10 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the job can commit daily_bets.json back

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scraper.py

      - name: Commit updated bets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_bets.json
          git diff --staged --quiet || git commit -m "Update daily_bets.json"
          git push
